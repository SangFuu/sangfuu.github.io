<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost at sea · Marwane El Fadily</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f0b14">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--night:#0f0b14;--violet:#4a3550;--lilac2:#b8a6c4;--gold:#c9a24a;--gold2:#e8c877;--cream:#f5e9c8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(120% 90% at 70% 10%,#4a3550 0%,#2a1d33 35%,#0f0b14 75%);background-color:var(--night);color:var(--cream);font:16px/1.6 "JetBrains Mono",Consolas,monospace;display:grid;place-items:center;overflow:hidden;text-align:center;padding:0 16px}
.sea{position:fixed;left:0;right:0;bottom:0;height:34vh;pointer-events:none}
.sea path{animation:swell 6s ease-in-out infinite alternate}
.sea path:nth-child(2){animation-duration:8s;animation-direction:alternate-reverse}
@keyframes swell{to{transform:translateX(-60px)}}
.ship{width:120px;margin:0 auto 10px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.code{font:900 clamp(90px,24vw,220px)/.9 Cinzel,Georgia,serif;color:transparent;-webkit-text-stroke:2px var(--gold);letter-spacing:.04em}
h1{font:900 clamp(26px,5vw,48px)/1.1 Cinzel,Georgia,serif;margin:6px 0 10px}
p{color:var(--lilac2);max-width:460px;margin:0 auto 26px;font-size:14px}
.runes{color:var(--gold);letter-spacing:.3em;font-size:13px;margin-bottom:18px}
a.btn{display:inline-flex;gap:10px;align-items:center;padding:14px 26px;border-radius:999px;background:var(--gold);color:var(--night);text-decoration:none;font:600 14px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;transition:background .3s}
a.btn:hover{background:var(--gold2)}
a.btn:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.lang{position:fixed;top:14px;right:16px;display:flex;border:1px solid var(--violet);border-radius:999px;overflow:hidden}
.lang button{background:transparent;border:0;color:var(--lilac2);padding:5px 10px;font:600 11px "JetBrains Mono",monospace;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--night)}
main{position:relative;z-index:2}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="lang" role="group" aria-label="Language / Langue">
  <button type="button" data-lang="en" aria-pressed="true">EN</button>
  <button type="button" data-lang="fr" aria-pressed="false">FR</button>
</div>
<main>
  <svg class="ship" viewBox="0 0 120 70" aria-hidden="true"><path d="M8 48 Q60 66 112 48 L116 40 Q60 56 4 40Z" fill="#5a3d2a" stroke="#c9a24a" stroke-width="1.5"/><rect x="58" y="6" width="3" height="40" fill="#f5e9c8"/><path d="M38 10 L82 10 L78 38 L42 38Z" fill="#f5e9c8"/><path d="M48 10 L52 38 M60 10 L60 38 M72 10 L68 38" stroke="#9a7bb0" stroke-width="3"/><path d="M112 48 Q122 36 114 28" fill="none" stroke="#e8c877" stroke-width="2.5"/></svg>
  <div class="code" aria-hidden="true">404</div>
  <h1 id="t">Lost at sea</h1>
  <p class="runes" aria-hidden="true">ᚾᛟ · ᛚᚨᚾᛞ · ᚺᛖᚱᛖ</p>
  <p id="d">This island isn't on the map. The page you're looking for doesn't exist, or it sailed away.</p>
  <a class="btn" href="/" id="b">⚓ Back to port</a>
</main>
<svg class="sea" viewBox="0 0 1440 300" preserveAspectRatio="none" aria-hidden="true"><path d="M-100 120 Q120 80 360 120 T840 120 T1320 120 T1800 120 V300 H-100Z" fill="#2f2139"/><path d="M-100 180 Q160 140 420 180 T940 180 T1460 180 T1900 180 V300 H-100Z" fill="#1c1424"/></svg>
<script>
const TXT={
  en:{t:'Lost at sea',d:"This island isn't on the map. The page you're looking for doesn't exist, or it sailed away.",b:'⚓ Back to port',title:'Lost at sea · Marwane El Fadily'},
  fr:{t:'Perdu en mer',d:"Cette île n'est pas sur la carte. La page que tu cherches n'existe pas, ou elle a pris le large.",b:'⚓ Retour au port',title:'Perdu en mer · Marwane El Fadily'}
};
function setLang(l){
  const s=TXT[l]; document.documentElement.lang=l; document.title=s.title;
  for(const k of ['t','d','b']) document.getElementById(k).textContent=s[k];
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===l)));
  try{localStorage.setItem('saga-lang',l)}catch{}
}
let l='en'; try{ if(localStorage.getItem('saga-lang')==='fr') l='fr' }catch{}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
setLang(l);
</script>
</body>
</html>
